name: Supabase Keep Alive

on:
  schedule:
    # Runs every 4 days at 00:00 UTC to prevent Supabase free-tier pausing (7-day inactivity limit)
    - cron: '0 0 */4 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent pausing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase to keep project alive..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          
          if [ "$response" -eq 200 ]; then
            echo "✅ Supabase ping successful (HTTP $response)"
          else
            echo "❌ Supabase ping failed (HTTP $response)"
            exit 1
          fi
